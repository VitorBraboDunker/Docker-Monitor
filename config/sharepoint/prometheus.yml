global:
  scrape_interval: 5m
  evaluation_interval: 1m
  external_labels:
    monitor: dunker-sharepoint
rule_files:
- /etc/dunker/sharepoint/rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets: [alertmanager:9093]
scrape_configs:
- job_name: dunker_sharepoint
  scrape_timeout: 30s
  static_configs:
  - targets: [sharepoint:9430]
