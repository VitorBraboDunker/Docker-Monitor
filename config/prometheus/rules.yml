groups:
- name: dunker-snmp-metrics
  rules:
  - record: dnk:snmp_expected
    expr: max by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name)
      (dnk_snmp_device_info)
  - record: dnk:snmp_up
    expr: max by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name)
      (up{job="snmp",managed_by="dnk"} and (time() - timestamp(up{job="snmp",managed_by="dnk"})
      < 180))
  - record: dnk:snmp_cpu_percent
    expr: max by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name)
      (sonicCurrentCPUUtil{job="snmp_health"} or dnkCustomCPUPercent{job="snmp_health"})
      or avg by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name) (hrProcessorLoad{job="snmp_health"})
  - record: dnk:snmp_ram_percent
    expr: max by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name)
      (sonicCurrentRAMUtil{job="snmp_health"} or dnkCustomRAMPercent{job="snmp_health"})
      or max by (CLIENTE,UNIDADE,Provedor,instance,tipo,monitor_id,monitor_name) (100
      * hrStorageUsed{job="snmp_health",hrStorageDescr=~"(?i).*ram.*|.*main memory.*"}
      / hrStorageSize{job="snmp_health",hrStorageDescr=~"(?i).*ram.*|.*main memory.*"})
  - record: dnk:snmp_in_bps
    expr: (rate(ifHCInOctets{job="snmp",managed_by="dnk"}[5m]) * 8) or on (monitor_id,ifIndex)
      (rate(ifInOctets{job="snmp",managed_by="dnk"}[5m]) * 8)
  - record: dnk:snmp_out_bps
    expr: (rate(ifHCOutOctets{job="snmp",managed_by="dnk"}[5m]) * 8) or on (monitor_id,ifIndex)
      (rate(ifOutOctets{job="snmp",managed_by="dnk"}[5m]) * 8)
  - record: dnk:snmp_in_selected_bps
    expr: (dnk:snmp_in_bps and on (monitor_id,ifIndex) dnk_snmp_interface_selected)
      or (dnk:snmp_in_bps unless on (monitor_id) dnk_snmp_interface_selected)
  - record: dnk:snmp_out_selected_bps
    expr: (dnk:snmp_out_bps and on (monitor_id,ifIndex) dnk_snmp_interface_selected)
      or (dnk:snmp_out_bps unless on (monitor_id) dnk_snmp_interface_selected)
  - record: dnk:snmp_download_utilization_percent
    expr: 100 * dnk:snmp_in_selected_bps / on (monitor_id,ifIndex) group_left() (dnk_snmp_contracted_download_bits
      > 0)
  - record: dnk:snmp_upload_utilization_percent
    expr: 100 * dnk:snmp_out_selected_bps / on (monitor_id,ifIndex) group_left() (dnk_snmp_contracted_upload_bits
      > 0)
- name: dunker-server-metrics
  rules:
  - record: dnk:server_observed_timestamp_seconds
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace((max
      by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade) (timestamp(windows_os_info)
      or timestamp(node_uname_info))), "CLIENTE", "$1", "Cliente", "(.+)"), "UNIDADE",
      "$1", "Unidade", "(.+)"))
  - record: dnk:server_cpu_percent
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace((100
      * (1 - avg by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade) (rate(windows_cpu_time_total{mode="idle"}[3m])
      or rate(node_cpu_seconds_total{mode="idle"}[3m])))), "CLIENTE", "$1", "Cliente",
      "(.+)"), "UNIDADE", "$1", "Unidade", "(.+)"))
  - record: dnk:server_ram_percent
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace(((100
      * (1 - windows_memory_available_bytes / windows_os_visible_memory_bytes)) or
      (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))),
      "CLIENTE", "$1", "Cliente", "(.+)"), "UNIDADE", "$1", "Unidade", "(.+)"))
  - record: dnk:server_disk_percent
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace((max
      by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade) ((100 * (1 - windows_logical_disk_free_bytes
      / (windows_logical_disk_size_bytes > 0))) or (100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
      / (node_filesystem_size_bytes > 0))))), "CLIENTE", "$1", "Cliente", "(.+)"),
      "UNIDADE", "$1", "Unidade", "(.+)"))
  - record: dnk:server_network_bps
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace((sum
      by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade) (8 * (rate(windows_net_bytes_received_total[3m])
      or rate(node_network_receive_bytes_total{device!="lo"}[3m]))) + sum by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade)
      (8 * (rate(windows_net_bytes_sent_total[3m]) or rate(node_network_transmit_bytes_total{device!="lo"}[3m])))),
      "CLIENTE", "$1", "Cliente", "(.+)"), "UNIDADE", "$1", "Unidade", "(.+)"))
  - record: dnk:server_failed_services
    expr: max by (asset_id,CLIENTE,UNIDADE,instance) (label_replace(label_replace((sum
      by (asset_id,CLIENTE,UNIDADE,instance,Cliente,Unidade) ((windows_service_state{state="stopped"}
      * on(instance,name,CLIENTE,UNIDADE,Cliente,Unidade) group_left() windows_service_start_mode{start_mode="auto"})
      or node_systemd_unit_state{state="failed"})), "CLIENTE", "$1", "Cliente", "(.+)"),
      "UNIDADE", "$1", "Unidade", "(.+)"))
- name: dunker-status-alerts
  rules:
  - alert: DunkerAtivoCritico
    expr: dnk_asset_status == 4
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.CLIENTE }} / {{ $labels.UNIDADE }}: {{ $labels.name }}
        Crítico'
      description: '{{ $labels.reason }}'
  - alert: DunkerAtivoGrave
    expr: dnk_asset_status == 3
    for: 1m
    labels:
      severity: error
    annotations:
      summary: '{{ $labels.name }} Grave'
  - alert: DunkerSemDados
    expr: dnk_asset_status == 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.name }} Sem Dados'
  - alert: DunkerMotorStatusIndisponivel
    expr: (time() - dnk_status_last_update_timestamp_seconds > 120) or (up{job="dunker_status"}
      == 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Motor de status indisponível
  - alert: DunkerCertificadoCritico
    expr: dnk_domain_status >= 3 and dnk_domain_status != 5
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Certificado/dominio {{ $labels.host }} requer atenção
