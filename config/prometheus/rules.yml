groups:
- name: dunker-recording
  rules:
  - record: dnk:target_seen
    expr: max by (Cliente,Unidade,Provedor,instance,tipo) (label_replace(((time()
      - timestamp(probe_success{job="blackbox_icmp"})) < 180), "tipo", "icmp", "job",
      ".*") or label_replace(((time() - timestamp(probe_success{job="blackbox_http"}))
      < 180), "tipo", "http", "job", ".*") or label_replace(((time() - timestamp(probe_success{job="blackbox_tcp"}))
      < 180), "tipo", "tcp", "job", ".*") or label_replace(((time() - timestamp(up{job="snmp"}))
      < 180), "tipo", "snmp", "job", ".*") or label_replace(((time() - timestamp(up{job="integrations/windows"}))
      < 180), "tipo", "windows", "job", ".*") or label_replace(((time() - timestamp(up{job="integrations/unix"}))
      < 180), "tipo", "linux", "job", ".*"))
  - record: dnk:availability_state
    expr: max by (Cliente,Unidade,Provedor,instance,tipo) (label_replace((3 * (1 -
      probe_success{job="blackbox_icmp"})), "tipo", "icmp", "job", ".*") or label_replace((3
      * (1 - probe_success{job="blackbox_http"})), "tipo", "http", "job", ".*") or
      label_replace((3 * (1 - probe_success{job="blackbox_tcp"})), "tipo", "tcp",
      "job", ".*") or label_replace((3 * (1 - up{job="snmp"})), "tipo", "snmp", "job",
      ".*") or label_replace((3 * (1 - up{job="integrations/windows"})), "tipo", "windows",
      "job", ".*") or label_replace((3 * (1 - up{job="integrations/unix"})), "tipo",
      "linux", "job", ".*"))
  - record: dnk:latency_state
    expr: 2 * (avg_over_time(dnk_ping_rtt_seconds[5m]) * 1000 > bool on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      dnk_ping_config_latency_warning_milliseconds) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_collector_success == 1) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      ((time() - dnk_ping_last_measurement_timestamp_seconds) < on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_config_interval_seconds * 2 + dnk_ping_config_packet_count * dnk_ping_config_timeout_seconds
      + 30))
  - record: dnk:packetloss_state
    expr: 2 * (avg_over_time(dnk_ping_loss_percent[5m]) > bool on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      dnk_ping_config_loss_warning_percent) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_collector_success == 1) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      ((time() - dnk_ping_last_measurement_timestamp_seconds) < on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_config_interval_seconds * 2 + dnk_ping_config_packet_count * dnk_ping_config_timeout_seconds
      + 30))
  - record: dnk:cpu_percent
    expr: label_replace((100 * (1 - avg by (Cliente,Unidade,Provedor,instance) (rate(windows_cpu_time_total{mode="idle"}[5m])))),
      "tipo", "windows", "job", ".*") or label_replace((100 * (1 - avg by (Cliente,Unidade,Provedor,instance)
      (rate(node_cpu_seconds_total{mode="idle"}[5m])))), "tipo", "linux", "job", ".*")
  - record: dnk:memory_percent
    expr: label_replace((100 * (1 - windows_memory_available_bytes / windows_memory_physical_total_bytes)),
      "tipo", "windows", "job", ".*") or label_replace((100 * (1 - node_memory_MemAvailable_bytes
      / node_memory_MemTotal_bytes)), "tipo", "linux", "job", ".*")
  - record: dnk:disk_free_percent
    expr: label_replace((100 * windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
      / windows_logical_disk_size_bytes), "tipo", "windows", "job", ".*") or label_replace((100
      * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs",mountpoint!~"/host.*|/run.*|/var/lib/docker.*"}
      / node_filesystem_size_bytes), "tipo", "linux", "job", ".*")
  - record: dnk:cpu_state
    expr: 2 * (dnk:cpu_percent > bool 85)
  - record: dnk:memory_state
    expr: 2 * (dnk:memory_percent > bool 90)
  - record: dnk:disk_state
    expr: 2 * (dnk:disk_free_percent < bool 10) + (dnk:disk_free_percent < bool 5)
  - record: dnk:target_health
    expr: (max by (Cliente,Unidade,Provedor,instance,tipo) ({__name__=~"dnk:(availability|latency|packetloss|cpu|memory|disk)_state"})
      and on (Cliente,Unidade,Provedor,instance,tipo) dnk:target_seen and on (Cliente,Unidade,Provedor,instance,tipo)
      dnk_target_expected) or on (Cliente,Unidade,Provedor,instance,tipo) (dnk_target_expected
      unless on (Cliente,Unidade,Provedor,instance,tipo) dnk:target_seen)
  - record: dnk:client_health
    expr: max by (Cliente) (dnk:target_health)
- name: dunker-alerts
  rules:
  - alert: LinkSemResposta
    expr: probe_success{job="blackbox_icmp"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'Link sem resposta: {{ $labels.Cliente }} / {{ $labels.instance }}'
      description: "ICMP falhou por 2 minutos. ICMP bloqueado n\xE3o comprova queda\
        \ de toda a rede."
  - alert: LatenciaAlta
    expr: dnk_ping_rtt_seconds * 1000 > on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      dnk_ping_config_latency_warning_milliseconds and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_collector_success == 1) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      ((time() - dnk_ping_last_measurement_timestamp_seconds) < on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_config_interval_seconds * 2 + dnk_ping_config_packet_count * dnk_ping_config_timeout_seconds
      + 30))
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Lat\xEAncia acima do limite configurado: {{ $labels.instance }}"
      description: Limite definido no cadastro de monitoramento.
  - alert: PerdaDePacotes
    expr: dnk_ping_loss_percent > on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      dnk_ping_config_loss_warning_percent and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_collector_success == 1) and on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      ((time() - dnk_ping_last_measurement_timestamp_seconds) < on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_config_interval_seconds * 2 + dnk_ping_config_packet_count * dnk_ping_config_timeout_seconds
      + 30))
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Perda ICMP: {{ $labels.instance }}'
      description: Limite e quantidade de pacotes definidos no cadastro.
  - alert: FalhaColetorPing
    expr: dnk_ping_collector_success == 0 or (dnk_ping_last_measurement_timestamp_seconds
      unless on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      ((time() - dnk_ping_last_measurement_timestamp_seconds) < on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      (dnk_ping_config_interval_seconds * 2 + dnk_ping_config_packet_count * dnk_ping_config_timeout_seconds
      + 30))) or (dnk_ping_config_interval_seconds unless on (Cliente,Unidade,Provedor,instance,tipo,monitor_id,monitor_name,criticidade)
      dnk_ping_last_measurement_timestamp_seconds) or (time() - dnk_ping_last_round_timestamp_seconds
      > 90) or dnk_ping_config_error == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Falha de medi\xE7\xE3o de perda"
      description: "Verifique permiss\xF5es ICMP, configura\xE7\xE3o e capacidade\
        \ da VM."
  - alert: SNMPIndisponivel
    expr: up{job="snmp"} == 0
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "SNMP indispon\xEDvel: {{ $labels.instance }}"
      description: "Confira rota/VPN, UDP 161, credenciais e suporte dos m\xF3dulos."
  - alert: SemTelemetria
    expr: dnk:target_health == 1
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: 'Sem dados: {{ $labels.Cliente }} / {{ $labels.instance }}'
      description: Alvo cadastrado sem amostras recentes.
  - alert: CPUElevada
    expr: dnk:cpu_percent > 85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: 'CPUElevada: {{ $labels.instance }}'
      description: Confira o painel de servidores.
  - alert: MemoriaElevada
    expr: dnk:memory_percent > 90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: 'MemoriaElevada: {{ $labels.instance }}'
      description: Confira o painel de servidores.
  - alert: DiscoPoucoEspaco
    expr: dnk:disk_free_percent < 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'DiscoPoucoEspaco: {{ $labels.instance }}'
      description: Confira o painel de servidores.
  - alert: DiscoCritico
    expr: dnk:disk_free_percent < 5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'DiscoCritico: {{ $labels.instance }}'
      description: Confira o painel de servidores.
  - alert: ColetorCentralIndisponivel
    expr: up{job=~"exporter_.*|dunker_inventory"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Coletor indispon\xEDvel"
      description: "Confira o servi\xE7o e os logs da VM."
  - alert: InventarioAusente
    expr: absent(dnk_target_expected)
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "Invent\xE1rio sem dados"
      description: "O painel geral depende do invent\xE1rio."
  - alert: ServicoIndisponivel
    expr: probe_success{job=~"blackbox_http|blackbox_tcp"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Endpoint indispon\xEDvel: {{ $labels.instance }}"
      description: "Verifique servi\xE7o, porta, certificado ou rota."
