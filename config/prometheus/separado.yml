global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: dunker-local
rule_files:
- /etc/dunker/prometheus/rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
  metric_relabel_configs:
  - source_labels:
    - CLIENTE
    - Cliente
    separator: ;
    regex: ;(.+)
    target_label: CLIENTE
    replacement: $1
  - source_labels:
    - UNIDADE
    - Unidade
    separator: ;
    regex: ;(.+)
    target_label: UNIDADE
    replacement: $1
  - action: labeldrop
    regex: Cliente|Unidade
- job_name: dunker_inventory
  honor_labels: true
  static_configs:
  - targets:
    - ping:9427
  metric_relabel_configs:
  - source_labels:
    - CLIENTE
    - Cliente
    separator: ;
    regex: ;(.+)
    target_label: CLIENTE
    replacement: $1
  - source_labels:
    - UNIDADE
    - Unidade
    separator: ;
    regex: ;(.+)
    target_label: UNIDADE
    replacement: $1
  - action: labeldrop
    regex: Cliente|Unidade
- job_name: snmp
  metrics_path: /snmp
  scrape_interval: 60s
  scrape_timeout: 50s
  file_sd_configs:
  - files:
    - /etc/dunker/targets/snmp.json
    refresh_interval: 30s
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - source_labels:
    - snmp_auth
    target_label: __param_auth
  - source_labels:
    - snmp_module
    target_label: __param_module
  - target_label: __address__
    replacement: snmp:9116
  - action: labeldrop
    regex: snmp_auth|snmp_module
  metric_relabel_configs:
  - source_labels:
    - CLIENTE
    - Cliente
    separator: ;
    regex: ;(.+)
    target_label: CLIENTE
    replacement: $1
  - source_labels:
    - UNIDADE
    - Unidade
    separator: ;
    regex: ;(.+)
    target_label: UNIDADE
    replacement: $1
  - action: labeldrop
    regex: Cliente|Unidade
